version: '3.8'

services:
  backend:
    build:
      context: ./medichain-backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./medichain-backend/.env
    environment:
      - PORT=3000
      - FRONTEND_URL=http://localhost:8080

  frontend:
    build:
      context: ./medichain-frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=http://localhost:3000/api
      - VITE_WS_URL=http://localhost:3000
    depends_on:
      - backend
